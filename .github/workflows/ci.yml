name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 安装 staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
      - name: 检查
        run: scripts/check.sh

