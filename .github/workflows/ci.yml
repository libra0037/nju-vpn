name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: platforms
        run: echo "matrix=$(bash scripts/toolchain.sh --matrix)" >> "$GITHUB_OUTPUT"
  check:
    timeout-minutes: 30
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 核对原生目标
        run: test "$(go env GOOS)/$(go env GOARCH)" = '${{ matrix.target }}'
      - name: 安装 staticcheck 与 deadcode
        run: |
          source scripts/toolchain.sh
          go install honnef.co/go/tools/cmd/staticcheck@$STATICCHECK_VERSION
          go install golang.org/x/tools/cmd/deadcode@$DEADCODE_VERSION
      - name: 检查
        run: scripts/check.sh
      - name: 检查发布测试对端
        if: matrix.target == 'linux/amd64' || matrix.target == 'windows/amd64'
        run: bash scripts/check-direct-peer.sh
      - name: 检查受控目标（Python 3.12，Ubuntu 24.04）
        if: matrix.target == 'linux/amd64'
        run: |
          python3 scripts/release-test/target-server-test.py -v
          python3 scripts/release-test/target-ip-test.py -v
          bash scripts/release-test/build-test-bundle-test.sh
      - name: 检查实机脚本（Windows PowerShell 5.1）
        if: matrix.target == 'windows/amd64'
        shell: powershell
        run: |
          Push-Location scripts/release-test/direct-peer
          go build -trimpath -o "$env:RUNNER_TEMP/test-peer.exe" .
          if ($LASTEXITCODE -ne 0) { throw '构建上传测试工具失败' }
          Pop-Location
          .\scripts\release-test\target-test.ps1
          .\scripts\release-test\live-windows-test.ps1 -PeerToolPath "$env:RUNNER_TEMP/test-peer.exe"
          .\scripts\release-test\collect-logs-windows-test.ps1 -PeerToolPath "$env:RUNNER_TEMP/test-peer.exe"
          .\scripts\release-test\windows-guards-test.ps1
