# njuvpn 服务进程配置。复制为 config.yaml 后填写，该文件不要提交到 git。

# --- VPN 登录 ---
server: vpn.nju.edu.cn

# 可选：本机 DNS 解析不了 server 时，用这个地址实际建连，
# 协议层仍用 server 生成 Host 头。校园网内通常需要它。
server_ip: ""

port: 443
username: yourname
# 口令。留空表示不写进磁盘：`njuvpn start` 会在终端提示输入（不回显），
# 通过本地套接字交给服务进程，只留在它的内存里。填了则服务进程自己读它，
# 好处是进程重启后重新建隧道不必再输一次。
password: ""

# 出站代理。留空表示直连。支持 http:// 和 socks5:// 两种写法。
#
# 注意：服务端把隧道会话绑定到源 IP，因此代理必须提供**稳定且唯一**的
# 出口 IP。实测某些代理会在 IPv4 与 IPv6 出口之间轮换，导致登录与建隧道
# 走了不同出口，服务端直接拒绝（控制码 03/08）。校园网内直连即可，不需要代理。
proxy: ""

# 可选：TOTP 密钥（Base32）。填了就自动算验证码，服务进程可以无人值守启动；
 # 留空则退化成短信验证：`njuvpn start` 会在需要时提示输入验证码。
# 取值方式：VPN 的 TOTP 绑定页面二维码里 otpauth://totp/...?secret=XXXX 的 secret 部分。
totp_secret: ""

# --- WireGuard 承载 ---
wireguard:
  # 对外暴露的 UDP 端口。留空或填 0 都按默认值 51820 处理。
  # 监听端口不需要 root：本实现是用户态 UDP，不是内核 WireGuard 接口。
  listen_port: 51820
  # 监听范围。默认 loopback：只绑 127.0.0.1，服务端与客户端在同一台机器上
  # 时用这个，同一个局域网里的其他人连不上这个端口。
  # 要让其他机器接入时改成 all（会绑定全部网卡，请自行确认防火墙）。
  listen_host: loopback
  # 留空则首次启动自动生成并写回本文件；生成后启动日志会打印服务端公钥，
  # 客户端配置里要用它。每次启动换公钥会让客户端失效，所以会自动持久化。
  private_key: ""
  # 客户端公钥，只允许这一个 peer 接入。留空时服务照常监听，但没人能接入。
  peer_public_key: ""
  # 分配给客户端 peer 的地址。它只在隧道内有效：
  # 服务端会把来自这个地址的包改写成校园网分配的地址再发出去。
  peer_address: 10.66.66.2

# --- 服务进程与命令行客户端通信 ---
ipc:
  # 留空表示按这份配置文件的路径派生一个端点：Linux 是 $XDG_RUNTIME_DIR/
  # njuvpn-<hash>.sock（取不到该变量时退回 /tmp 下的私有目录），Windows 是
  # 命名管道 \\.\pipe\njuvpn-<hash>。同一台机器上跑多个实例（每人一份配置）
  # 时，端点自动互不相同，不会互相打扰。
  # 也可以显式指定：Linux 必须是绝对路径，Windows 必须是命名管道名。
  # 服务进程由 njuvpn start 按需拉起，不需要手工运行 njuvpn run。
  endpoint: ""

# MTU：底层隧道 1400，再减去 WireGuard 封装开销
mtu: 1320

log:
  level: info
