# njuvpn 服务进程配置。复制为 config.yaml 后填写。

server: vpn.nju.edu.cn
server_ip: ""
port: 443

username: "通常是学工号"
password: ""

# 口令登录的域。服务端通常给出多个可选域，留空时用返回的第一个。
# 显式指定的域不存在时登录失败，不回退到其他域。
login_domain: ""

# 设备标识。
device_id: ""

# 出站代理，留空表示直连。支持 http:// 与 socks5:// 两种写法。
proxy: ""

# 自签节点唯一的信任来源：DER SubjectPublicKeyInfo 的 SHA-256，
# 使用带填充的标准 Base64。必须有 1–16 项且不重复；程序只读、不自动补录。
# 以下两项是本部署已观测到的活跃指纹，证书有效期均为一年。
# 同公钥续签无需修改；换公钥须通过可信来源确认并更新，再 njuvpn restart。
# 控制面始终校验证书链与名称。
pinned_node_spki_sha256:
  - "a2czXjambEMdvKj+wcCn2YNF4AFf84W5AXdF4GzMGAY="
  - "cqCxa81gLyniGGB1PyKnjhxKN2wfBTs8NNy72SfRFpY="

wireguard:
  # 对外暴露的 UDP 端口。留空或填 0 都按默认值 51820 处理。
  listen_port: 51820
  # 监听范围，取值 loopback 或 all。
  listen_host: loopback
  # 承载层私钥，留空则由程序自动生成并写回本文件，生成后启动日志会打印承载层公钥。
  private_key: ""
  # 对端公钥。只有这一个对端能接入承载层。留空时服务照常监听，但没人能接入。
  peer_public_key: ""
  # 分配给 WireGuard 对端的地址。
  peer_address: 10.66.66.2

# 两段隧道共用的内层 MTU。
mtu: 1400

log:
  level: info
